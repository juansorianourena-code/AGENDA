<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>Agenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="sub" id="sub"></p>
        <h1 id="title"></h1>
      </div>
      <button class="add" id="addBtn" aria-label="Añadir evento">+</button>
    </header>

    <nav class="bar">
      <div class="tabs" id="tabs">
        <button data-view="day">Día</button>
        <button data-view="week">Semana</button>
        <button data-view="month">Mes</button>
        <button data-view="year">Año</button>
      </div>
      <div class="nav">
        <button id="prev" aria-label="Anterior">‹</button>
        <button id="today">Hoy</button>
        <button id="next" aria-label="Siguiente">›</button>
      </div>
    </nav>

    <section class="legend" id="legend" aria-label="Calendarios"></section>
    <main id="view"></main>
    <footer class="foot">
      <span id="status"></span>
      <span class="grow"></span>
      <span id="who"></span>
      <button id="signout" class="link">Salir</button>
    </footer>
  </div>

  <div id="auth" class="auth" hidden>
    <form id="authForm" class="authbox">
      <h1>Agenda</h1>
      <p class="sub">Entra para ver tu agenda en cualquier dispositivo.</p>
      <label>Correo <input type="email" name="email" required autocomplete="email"></label>
      <label>Contraseña <input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
      <p id="authMsg" class="msg"></p>
      <div class="actions">
        <button type="submit" class="primary" id="loginBtn">Entrar</button>
        <button type="button" class="ghost" id="signupBtn">Crear cuenta</button>
      </div>
    </form>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h2 id="dlgTitle">Nuevo evento</h2>
      <label>Título <input name="title" required autocomplete="off"></label>
      <label>Calendario <select name="cal"></select></label>
      <label>Fecha <input type="date" name="date" required></label>
      <div class="row">
        <label>Inicio <input type="time" name="start"></label>
        <label>Fin <input type="time" name="end"></label>
      </div>
      <label>Notas <textarea name="notes" rows="2"></textarea></label>
      <div class="actions">
        <button type="button" id="del" class="ghost">Eliminar</button>
        <span class="grow"></span>
        <button type="button" id="cancel" class="ghost">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
