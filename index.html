<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>Agenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="date" id="date"></p>
      <h1>Hoy</h1>
    </header>

    <section class="card">
      <h2>Tu agenda está en marcha</h2>
      <p>Esta es la primera versión. Poco a poco irá apareciendo aquí todo lo que tienes que hacer.</p>
    </section>

    <section class="legend" aria-label="Calendarios">
      <span><i style="background:var(--navy)"></i>Universidad</span>
      <span><i style="background:var(--olive)"></i>JMV</span>
      <span><i style="background:var(--ink)"></i>Exámenes</span>
      <span><i style="background:var(--sand)"></i>Catequesis</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
